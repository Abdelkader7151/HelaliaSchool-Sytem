<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Equipment · HLS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-page="inv-equipment" data-title="Equipment" data-sub="الأصول — equipment & asset tracking">

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="content-wrap">
    <div id="topbar-mount"></div>

    <div class="page">

      <div class="tabs-nav mb-4" id="books">
        <a href="inventory-supplies.html">Supplies · المستلزمات</a>
        <a href="inventory-equipment.html" class="active">Equipment · الأصول</a>
        <a href="inventory-maintenance.html">Maintenance · الصيانة</a>
        <a href="inventory-issues.html">Stock issues · صرف المخزون</a>
        <a href="inventory-receipts.html">Goods receipts · استلام المخزون</a>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon blue"><i class="fa-solid fa-display"></i></div><div class="kpi-label">Assets</div><div class="kpi-value" id="k-assets">0</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon green"><i class="fa-solid fa-sack-dollar"></i></div><div class="kpi-label">Total cost</div><div class="kpi-value mono" id="k-cost" style="font-size:20px;">EGP 0</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon amber"><i class="fa-solid fa-screwdriver-wrench"></i></div><div class="kpi-label">Under maintenance</div><div class="kpi-value" id="k-maint">0</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon" style="background:var(--err-soft);color:var(--err)"><i class="fa-solid fa-shield-halved"></i></div><div class="kpi-label">Warranty expired</div><div class="kpi-value" id="k-warr">0</div></div></div>
      </div>

      <div class="page-head">
        <div class="d-flex gap-2 align-items-center flex-wrap">
          <input type="search" class="form-control" id="search" placeholder="Search name, serial…" style="max-width:230px;" oninput="render()">
          <select class="form-select" id="f-cat" style="max-width:160px;" onchange="render()"><option value="">All categories</option></select>
          <select class="form-select" id="f-status" style="max-width:170px;" onchange="render()"><option value="">All statuses</option></select>
        </div>
        <button class="btn btn-primary" data-perm="edit" onclick="openAdd()"><i class="fa-solid fa-plus me-1"></i> Add equipment</button>
      </div>

      <div class="table-wrap">
        <table class="table mb-0 align-middle">
          <thead>
            <tr>
              <th>Name</th><th>Serial no</th><th>Category</th><th>Location</th>
              <th>Purchase date</th><th>Warranty until</th><th>Status</th><th class="text-end">Actions</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="muted small mt-2" id="count-line"></div>

    </div>
  </div>
</div>

<!-- ===== Equipment form modal ===== -->
<div class="modal fade" id="eqModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <div><div class="card-title" id="eq-mtitle">Add equipment</div><div class="card-sub">بيانات الأصل</div></div>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="f-id">
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Name *</label><input class="form-control" id="f-name" placeholder="e.g. Dell OptiPlex PC"></div>
          <div class="col-md-3"><label class="form-label">Serial no</label><input class="form-control mono" id="f-serial" placeholder="DL-0000-AA"></div>
          <div class="col-md-3"><label class="form-label">Category</label><select class="form-select" id="f-fcat"></select></div>
          <div class="col-md-4"><label class="form-label">Location type</label><select class="form-select" id="f-loc"></select></div>
          <div class="col-md-8"><label class="form-label">Location name / room</label><input class="form-control" id="f-locname" placeholder="e.g. IT Lab 1 / Room 204"></div>
          <div class="col-md-4"><label class="form-label">Purchase date</label><input type="date" class="form-control" id="f-date"></div>
          <div class="col-md-4"><label class="form-label">Cost (EGP)</label><input type="number" class="form-control mono" id="f-cost" min="0" value="0"></div>
          <div class="col-md-4"><label class="form-label">Warranty until</label><input type="date" class="form-control" id="f-warr"></div>
          <div class="col-md-4"><label class="form-label">Status</label><select class="form-select" id="f-status2"></select></div>
          <div class="col-md-8"><label class="form-label">Notes</label><input class="form-control" id="f-notes" placeholder="Optional"></div>
        </div>
        <div class="text-danger small mt-2" id="f-err" style="display:none;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-light-2" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="saveEquip()"><i class="fa-solid fa-check me-1"></i> Save</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="delModal" tabindex="-1">
  <div class="modal-dialog modal-sm"><div class="modal-content"><div class="modal-body text-center p-4">
    <div class="kpi-icon" style="background:var(--err-soft);color:var(--err);width:48px;height:48px;margin:0 auto 12px;font-size:19px;"><i class="fa-solid fa-trash"></i></div>
    <div style="font-weight:700;margin-bottom:4px;">Delete asset?</div><div class="muted small mb-3" id="del-name"></div>
    <div class="d-flex gap-2"><button class="btn btn-light-2 flex-fill" data-bs-dismiss="modal">Cancel</button>
    <button class="btn flex-fill" style="background:var(--err);color:#fff;" onclick="confirmDelete()">Delete</button></div>
  </div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/permissions.js"></script>
<script src="assets/js/shell.js"></script>
<script>
let eqModal, delModal, delId = null;
const TODAY = '2026-06-24';
const catColor = { Computer: 'blue', Projector: 'purple', Printer: 'info', 'Lab equipment': 'green', Furniture: 'amber', AV: 'pink', Network: 'info', Kitchen: 'amber', Sports: 'pink' };
const warrExpired = w => w && w < TODAY;

function render() {
  const all = STORE.equipment();
  const q = (document.getElementById('search').value || '').toLowerCase();
  const fc = document.getElementById('f-cat').value, fs = document.getElementById('f-status').value;
  const rows = all.filter(e => {
    if (fc && e.category !== fc) return false;
    if (fs && e.status !== fs) return false;
    if (q && !(`${e.name} ${e.serial}`.toLowerCase().includes(q))) return false;
    return true;
  });
  document.getElementById('tbody').innerHTML = rows.map(e => `
      <tr>
        <td><div style="font-weight:700;">${e.name}</div><div class="muted small mono">${e.id}</div></td>
        <td class="mono small">${e.serial || '—'}</td>
        <td><span class="pill ${catColor[e.category] || 'muted'}">${e.category}</span></td>
        <td>${e.locationName || e.location || '—'}<div class="muted small">${e.location || ''}</div></td>
        <td class="mono small">${e.purchased || '—'}</td>
        <td class="mono small ${warrExpired(e.warranty) ? 'text-danger fw-semibold' : ''}">${e.warranty || '—'}${warrExpired(e.warranty) ? ' <i class="fa-solid fa-circle-exclamation" style="font-size:10px"></i>' : ''}</td>
        <td><span class="pill ${LIBERTY.EQ_STATUS[e.status] || 'muted'}">${e.status}</span></td>
        <td class="text-end">
          <button class="btn-icon" title="Edit" data-perm="edit" onclick="openEdit('${e.id}')"><i class="fa-solid fa-pen"></i></button>
          <button class="btn-icon" title="Delete" data-perm="delete" onclick="askDelete('${e.id}')" style="color:var(--err);"><i class="fa-solid fa-trash"></i></button>
        </td>
      </tr>`).join('') || `<tr><td colspan="8" class="text-center muted" style="padding:30px">No equipment match.</td></tr>`;
  document.getElementById('count-line').textContent = `${rows.length} of ${all.length} assets`;
  document.getElementById('k-assets').textContent = all.length;
  document.getElementById('k-cost').textContent = LIBERTY.money(all.reduce((a, e) => a + (e.cost || 0), 0));
  document.getElementById('k-maint').textContent = all.filter(e => e.status === 'Under maintenance').length;
  document.getElementById('k-warr').textContent = all.filter(e => warrExpired(e.warranty)).length;
}

function fillSelects() {
  const cats = LIBERTY.equipCategories.map(c => `<option>${c}</option>`).join('');
  document.getElementById('f-fcat').innerHTML = cats;
  document.getElementById('f-cat').innerHTML = '<option value="">All categories</option>' + cats;
  document.getElementById('f-loc').innerHTML = LIBERTY.equipLocations.map(l => `<option>${l}</option>`).join('');
  const st = LIBERTY.equipStatuses.map(s => `<option>${s}</option>`).join('');
  document.getElementById('f-status2').innerHTML = st;
  document.getElementById('f-status').innerHTML = '<option value="">All statuses</option>' + st;
}
function openAdd() {
  document.getElementById('eq-mtitle').textContent = 'Add equipment';
  ['f-id', 'f-name', 'f-serial', 'f-locname', 'f-notes'].forEach(i => document.getElementById(i).value = '');
  document.getElementById('f-cost').value = 0; document.getElementById('f-date').value = TODAY;
  document.getElementById('f-warr').value = ''; document.getElementById('f-fcat').selectedIndex = 0;
  document.getElementById('f-loc').selectedIndex = 0; document.getElementById('f-status2').selectedIndex = 0;
  document.getElementById('f-err').style.display = 'none'; eqModal.show();
}
function openEdit(id) {
  const e = STORE.equipment().find(x => x.id === id); if (!e) return;
  document.getElementById('eq-mtitle').textContent = 'Edit equipment';
  document.getElementById('f-id').value = e.id; document.getElementById('f-name').value = e.name;
  document.getElementById('f-serial').value = e.serial || ''; document.getElementById('f-fcat').value = e.category;
  document.getElementById('f-loc').value = e.location || 'Room'; document.getElementById('f-locname').value = e.locationName || '';
  document.getElementById('f-date').value = e.purchased || ''; document.getElementById('f-cost').value = e.cost || 0;
  document.getElementById('f-warr').value = e.warranty || ''; document.getElementById('f-status2').value = e.status;
  document.getElementById('f-notes').value = e.notes || ''; document.getElementById('f-err').style.display = 'none'; eqModal.show();
}
function saveEquip() {
  const name = document.getElementById('f-name').value.trim();
  const err = document.getElementById('f-err');
  if (!name) { err.textContent = 'Name is required.'; err.style.display = 'block'; return; }
  STORE.saveEquipment({
    id: document.getElementById('f-id').value || '', name,
    serial: document.getElementById('f-serial').value.trim(), category: document.getElementById('f-fcat').value,
    location: document.getElementById('f-loc').value, locationName: document.getElementById('f-locname').value.trim(),
    purchased: document.getElementById('f-date').value, cost: parseFloat(document.getElementById('f-cost').value) || 0,
    warranty: document.getElementById('f-warr').value, status: document.getElementById('f-status2').value,
    notes: document.getElementById('f-notes').value.trim()
  });
  eqModal.hide(); render();
}
function askDelete(id) { const e = STORE.equipment().find(x => x.id === id); delId = id; document.getElementById('del-name').textContent = e.name + ' · ' + e.id; delModal.show(); }
function confirmDelete() { if (delId) STORE.deleteEquipment(delId); delId = null; delModal.hide(); render(); }

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    if (!document.getElementById('tbody')) return;
    eqModal = new bootstrap.Modal('#eqModal'); delModal = new bootstrap.Modal('#delModal');
    fillSelects(); render();
  }, 0);
});
</script>
</body>
</html>
