<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login · Helalia Language School</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body>

<div class="login-shell">

  <div class="login-side">
    <div>
      <div class="d-flex align-items-center gap-3">
        <img src="uploads/logo.png" alt="HLS" style="width:48px;height:48px;border-radius:50%;object-fit:cover;">
        <div>
          <div style="font-size:20px;font-weight:700;">Helalia Language School</div>
          <div style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#94a3b8;">School Management System</div>
        </div>
      </div>
    </div>

    <div>
      <h2 style="font-size:36px;font-weight:700;line-height:1.15;max-width:420px;">Manage your school's clarity and ease.</h2>
      <p style="color:#cbd5e1;max-width:380px;margin-top:14px;font-size:14px;line-height:1.6;">all in one place. Built for school administrators.</p>
    </div>

    <div style="font-size:12px;color:#94a3b8;">© 2026 Helalia Language School. All rights reserved.</div>
  </div>

  <div class="login-form-side">
    <div class="login-form-card">
      <h1>Welcome back</h1>
      <p class="lead">Sign in to access your dashboard</p>

      <form onsubmit="event.preventDefault(); window.location='dashboard.html';">
        <div class="mb-3">
          <label class="form-label">Username or email</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="fa-regular fa-user text-muted"></i></span>
            <input type="text" class="form-control" value="admin" autofocus>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">
            <span>Password</span>
          </label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
            <input type="password" class="form-control" value="liberty2026">
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="remember" checked>
            <label class="form-check-label small" for="remember">Remember me</label>
          </div>
        </div>

        <button class="btn btn-primary w-100 py-2 mb-3" type="submit">
          Sign in <i class="fa-solid fa-arrow-right ms-1"></i>
        </button>

        <div class="alert alert-light border small mb-0" style="background:var(--line-2);">
          <strong>Demo account:</strong> <code class="text-dark">admin</code> / <code class="text-dark">hls2027</code>
        </div>
      </form>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
