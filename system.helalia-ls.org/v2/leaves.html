<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leaves · HLS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-page="leaves" data-title="Leaves" data-sub="Manage all leave requests">

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="content-wrap">
    <div id="topbar-mount"></div>

    <div class="page">

      <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon amber"><i class="fa-solid fa-clock"></i></div><div class="kpi-label">Pending</div><div class="kpi-value">4</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon green"><i class="fa-solid fa-check"></i></div><div class="kpi-label">Approved</div><div class="kpi-value">4</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon" style="background:var(--err-soft);color:var(--err)"><i class="fa-solid fa-xmark"></i></div><div class="kpi-label">Rejected</div><div class="kpi-value">1</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon blue"><i class="fa-solid fa-calendar-day"></i></div><div class="kpi-label">Days this month</div><div class="kpi-value">23</div></div></div>
      </div>

      <div class="page-head">
        <div class="tabs-nav" id="tabs">
          <a class="active" data-status="all">All <span class="count">10</span></a>
          <a data-status="pending">Pending <span class="count">4</span></a>
          <a data-status="approved">Approved <span class="count">4</span></a>
          <a data-status="rejected">Rejected <span class="count">1</span></a>
        </div>
        <div class="d-flex gap-2">
          <a href="leave-form.html" class="btn btn-primary"><i class="fa-solid fa-plus me-1"></i> New request</a>
        </div>
      </div>

      <div class="table-wrap">
        <table class="table mb-0 align-middle">
          <thead>
            <tr>
              <th>Employee</th>
              <th>Type</th>
              <th>From</th>
              <th>To</th>
              <th class="num">Days</th>
              <th>Reason</th>
              <th>Status</th>
              <th class="num"></th>
            </tr>
          </thead>
          <tbody id="leaves-tbody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/permissions.js"></script>
<script src="assets/js/shell.js"></script>
<script>
let activeStatus = 'all';
const typeColor = { Annual:'purple', Sick:'info', Casual:'muted', Maternity:'pink' };
const statusPill = { pending:'warn', approved:'ok', rejected:'err' };

function render() {
  const tbody = document.getElementById('leaves-tbody');
  let rows = LIBERTY.leaves;
  if (activeStatus !== 'all') rows = rows.filter(l => l.status === activeStatus);
  const colors = ['purple','green','blue','pink','amber'];

  tbody.innerHTML = rows.map(l => {
    const emp = LIBERTY.employees.find(e => e.name === l.employee);
    const color = emp?.color || colors[l.id % colors.length];
    return `
      <tr id="row-${l.id}">
        <td>
          <div class="row-avatar">
            <div class="av ${color}">${LIBERTY.initials(l.employee)}</div>
            <div><div class="nm">${l.employee}</div></div>
          </div>
        </td>
        <td><span class="pill ${typeColor[l.type] || 'muted'}">${l.type}</span></td>
        <td class="mono small">${l.from}</td>
        <td class="mono small">${l.to}</td>
        <td class="num fw-semibold">${l.days}</td>
        <td class="muted small">${l.reason}</td>
        <td><span class="pill ${statusPill[l.status]}" id="pill-${l.id}">${l.status[0].toUpperCase()+l.status.slice(1)}</span></td>
        <td class="num">
          ${l.status === 'pending' ? `
            <button class="btn btn-icon btn-light-2 text-success" onclick="updateLeave(${l.id},'approved')" title="Approve"><i class="fa-solid fa-check"></i></button>
            <button class="btn btn-icon btn-light-2 text-danger" onclick="updateLeave(${l.id},'rejected')" title="Reject"><i class="fa-solid fa-xmark"></i></button>
          ` : `
            <button class="btn btn-icon btn-light-2" title="View"><i class="fa-regular fa-eye"></i></button>
          `}
        </td>
      </tr>
    `;
  }).join('');
}

function updateLeave(id, newStatus) {
  const l = LIBERTY.leaves.find(x => x.id === id);
  l.status = newStatus;
  render();
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('#tabs a').forEach(a => {
    a.addEventListener('click', (ev) => {
      ev.preventDefault();
      document.querySelectorAll('#tabs a').forEach(x => x.classList.remove('active'));
      a.classList.add('active');
      activeStatus = a.dataset.status;
      render();
    });
  });
  render();
});
</script>
</body>
</html>
