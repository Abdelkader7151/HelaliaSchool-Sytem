<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Excuses · HLS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-page="hr-excuses" data-title="Excuses" data-sub="الأذونات — delay · early leave · errand">

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="content-wrap">
    <div id="topbar-mount"></div>

    <div class="page">

      <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon purple"><i class="fa-solid fa-clock-rotate-left"></i></div><div class="kpi-label">Total excuses</div><div class="kpi-value" id="k-total">0</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon amber"><i class="fa-solid fa-clock"></i></div><div class="kpi-label">Pending</div><div class="kpi-value" id="k-pending">0</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon green"><i class="fa-solid fa-check"></i></div><div class="kpi-label">Approved</div><div class="kpi-value" id="k-approved">0</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon blue"><i class="fa-solid fa-hourglass-half"></i></div><div class="kpi-label">Hours away</div><div class="kpi-value" id="k-hours" style="font-size:22px;">0h</div></div></div>
      </div>

      <div class="page-head">
        <div class="tabs-nav" id="tabs">
          <a class="active" data-status="all">All</a>
          <a data-status="pending">Pending</a>
          <a data-status="approved">Approved</a>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" onclick="openAdd()"><i class="fa-solid fa-plus me-1"></i> Add excuse</button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="table mb-0 align-middle">
          <thead>
            <tr>
              <th>Employee</th><th>Section</th><th>Type</th><th>Date</th>
              <th>Time</th><th class="num">Duration</th><th>Reason</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- Add excuse modal -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <div><div class="card-title">Add excuse / permission</div><div class="card-sub">تسجيل إذن — تأخير / انصراف مبكر / مهمة</div></div>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label">Employee</label><select class="form-select" id="f-emp"></select></div>
        <div class="row g-3">
          <div class="col-12"><label class="form-label">Type</label>
            <select class="form-select" id="f-type">
              <option value="Late">Late arrival — حضور متأخر</option>
              <option value="Early">Early leave — انصراف مبكر</option>
              <option value="Errand">Errand — مهمة خارجية</option>
            </select></div>
          <div class="col-12"><label class="form-label">Date</label><input type="date" class="form-control" id="f-date" value="2026-05-28"></div>
          <div class="col-6"><label class="form-label">From</label><input type="time" class="form-control" id="f-from" value="08:00" oninput="calcDur()"></div>
          <div class="col-6"><label class="form-label">To</label><input type="time" class="form-control" id="f-to" value="10:00" oninput="calcDur()"></div>
          <div class="col-12"><label class="form-label">Reason</label><input type="text" class="form-control" id="f-reason" placeholder="e.g. Doctor appointment"></div>
        </div>
        <div class="d-flex justify-content-between align-items-center p-3 mt-3" style="background:var(--line-2);border-radius:10px;">
          <span class="muted">Duration away</span><span class="mono fw-bold" id="f-dur" style="font-size:16px;">2h 0m</span>
        </div>
        <div class="text-danger small mt-2" id="f-err" style="display:none;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-light-2" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="submitExc()"><i class="fa-solid fa-check me-1"></i> Submit excuse</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/permissions.js"></script>
<script src="assets/js/shell.js"></script>
<script>
const KEY = 'liberty_excuses_add';
const typeMeta = { Late: ['warn', 'fa-clock', 'Late arrival'], Early: ['info', 'fa-door-open', 'Early leave'], Errand: ['purple', 'fa-person-walking', 'Errand'] };
let addModal, activeStatus = 'all';
const stored = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (_) { return []; } };
const saveStored = a => localStorage.setItem(KEY, JSON.stringify(a));
const allRows = () => LIBERTY.excuses.concat(stored().map(e => ({ ...e, user: true })));

function durMins(from, to) {
  if (!from || !to) return 0;
  let m = (parseInt(to.slice(0, 2)) * 60 + parseInt(to.slice(3))) - (parseInt(from.slice(0, 2)) * 60 + parseInt(from.slice(3)));
  return m < 0 ? 0 : m;
}
const durLabel = m => Math.floor(m / 60) + 'h ' + (m % 60) + 'm';

function render() {
  const all = allRows();
  document.getElementById('k-total').textContent    = all.length;
  document.getElementById('k-pending').textContent  = all.filter(e => e.status === 'pending').length;
  document.getElementById('k-approved').textContent = all.filter(e => e.status === 'approved').length;
  const totalMins = all.reduce((s, e) => s + durMins(e.from, e.to), 0);
  document.getElementById('k-hours').textContent = (totalMins / 60).toFixed(1) + 'h';

  let rows = all;
  if (activeStatus !== 'all') rows = rows.filter(e => e.status === activeStatus);
  document.getElementById('tbody').innerHTML = rows.map(e => {
    const emp = LIBERTY.employees.find(x => x.name === e.employee);
    const color = emp?.color || 'purple';
    const [pc, ic, label] = typeMeta[e.type] || ['muted', 'fa-clock', e.type];
    return `
      <tr${e.user ? ' style="background:var(--ok-soft)"' : ''}>
        <td><div class="row-avatar"><div class="av ${color}">${LIBERTY.initials(e.employee)}</div>
          <div><div class="nm">${e.employee}${e.user ? ' <span class="pill ok" style="margin-left:4px">New</span>' : ''}</div></div></div></td>
        <td>${e.dept}</td>
        <td><span class="pill ${pc}"><i class="fa-solid ${ic}" style="font-size:9px"></i> ${label}</span></td>
        <td class="mono small">${e.date}</td>
        <td class="mono small">${e.from} – ${e.to}</td>
        <td class="num mono small">${durLabel(durMins(e.from, e.to))}</td>
        <td class="muted small">${e.reason}</td>
        <td><span class="pill ${e.status === 'approved' ? 'ok' : e.status === 'rejected' ? 'err' : 'warn'}">${e.status[0].toUpperCase() + e.status.slice(1)}</span></td>
      </tr>`;
  }).join('') || `<tr><td colspan="8" class="text-center muted" style="padding:30px">No ${activeStatus === 'all' ? '' : activeStatus} excuses</td></tr>`;
}

function calcDur() {
  document.getElementById('f-dur').textContent = durLabel(durMins(document.getElementById('f-from').value, document.getElementById('f-to').value));
}
function openAdd() {
  document.getElementById('f-reason').value = '';
  document.getElementById('f-err').style.display = 'none';
  calcDur();
  addModal.show();
}
function submitExc() {
  const employee = document.getElementById('f-emp').value;
  const type = document.getElementById('f-type').value;
  const date = document.getElementById('f-date').value;
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;
  const reason = document.getElementById('f-reason').value.trim();
  const err = document.getElementById('f-err');
  if (!employee || !date || !from || !to || !reason) { err.textContent = 'Fill in all fields.'; err.style.display = 'block'; return; }
  if (durMins(from, to) <= 0) { err.textContent = 'End time must be after start time.'; err.style.display = 'block'; return; }
  const dept = (LIBERTY.employees.find(e => e.name === employee) || {}).dept || '—';
  const list = stored();
  list.push({ employee, dept, type, date, from, to, reason, status: 'pending' });
  saveStored(list);
  render();
  addModal.hide();
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('f-emp').innerHTML = LIBERTY.employees.map(e => `<option>${e.name}</option>`).join('');
  addModal = new bootstrap.Modal('#addModal');
  document.querySelectorAll('#tabs a').forEach(a => a.addEventListener('click', ev => {
    ev.preventDefault();
    document.querySelectorAll('#tabs a').forEach(x => x.classList.remove('active'));
    a.classList.add('active'); activeStatus = a.dataset.status; render();
  }));
  render();
});
</script>
</body>
</html>
