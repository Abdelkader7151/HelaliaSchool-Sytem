<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Overtime · HLS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-page="overtime" data-title="Overtime" data-sub="الساعات الإضافية — May 2026">

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="content-wrap">
    <div id="topbar-mount"></div>

    <div class="page">

      <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon blue"><i class="fa-solid fa-stopwatch"></i></div><div class="kpi-label">Total OT hours</div><div class="kpi-value" id="k-hours">0</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon green"><i class="fa-solid fa-money-bill-wave"></i></div><div class="kpi-label">Total OT cost</div><div class="kpi-value mono" id="k-cost" style="font-size:22px;">EGP 0</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon purple"><i class="fa-solid fa-users"></i></div><div class="kpi-label">Employees</div><div class="kpi-value" id="k-emp">0</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon amber"><i class="fa-solid fa-clock"></i></div><div class="kpi-label">Pending approval</div><div class="kpi-value" id="k-pending">0</div></div></div>
      </div>

      <div class="page-head">
        <div class="d-flex gap-2 align-items-center">
          <span style="font-weight:600;">Overtime entries</span>
          <span class="pill info">Feeds the payroll engine</span>
        </div>
        <div class="d-flex gap-2">
          <a href="payroll-officer.html" class="btn btn-light-2"><i class="fa-solid fa-calculator me-1"></i> Payroll engine</a>
          <button class="btn btn-primary" onclick="openAdd()"><i class="fa-solid fa-plus me-1"></i> Add overtime</button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="table mb-0 align-middle">
          <thead>
            <tr>
              <th>Employee</th><th>Section</th><th>Date</th>
              <th class="num">Hours</th><th class="num">Rate / hr</th><th class="num">Amount</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- Add overtime modal -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <div><div class="card-title">Add overtime</div><div class="card-sub">إضافة ساعات إضافية</div></div>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label">Employee</label><select class="form-select" id="f-emp"></select></div>
        <div class="row g-3">
          <div class="col-6"><label class="form-label">Date</label><input type="date" class="form-control" id="f-date" value="2026-05-28"></div>
          <div class="col-3"><label class="form-label">Hours</label><input type="number" class="form-control mono" id="f-hours" min="0" step="0.5" value="2" oninput="calcAmt()"></div>
          <div class="col-3"><label class="form-label">Rate/hr</label><input type="number" class="form-control mono" id="f-rate" min="0" value="85" oninput="calcAmt()"></div>
        </div>
        <div class="d-flex justify-content-between align-items-center p-3 mt-3" style="background:var(--line-2);border-radius:10px;">
          <span class="muted">Amount</span><span class="mono fw-bold" id="f-amt" style="font-size:17px;color:var(--ok);">EGP 170</span>
        </div>
        <div class="text-danger small mt-2" id="f-err" style="display:none;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-light-2" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="submitOt()"><i class="fa-solid fa-check me-1"></i> Add entry</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/permissions.js"></script>
<script src="assets/js/shell.js"></script>
<script>
const KEY = 'liberty_overtime_add';
let addModal;
const stored = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (_) { return []; } };
const saveStored = a => localStorage.setItem(KEY, JSON.stringify(a));
const allRows = () => LIBERTY.overtime.concat(stored().map(o => ({ ...o, amount: o.hours * o.rate, user: true })));

function render() {
  const ot = allRows();
  document.getElementById('k-hours').textContent   = ot.reduce((s, o) => s + o.hours, 0);
  document.getElementById('k-cost').textContent    = LIBERTY.money(ot.reduce((s, o) => s + o.amount, 0));
  document.getElementById('k-emp').textContent     = new Set(ot.map(o => o.employee)).size;
  document.getElementById('k-pending').textContent = ot.filter(o => o.status === 'pending').length;

  document.getElementById('tbody').innerHTML = ot.map(o => {
    const emp = LIBERTY.employees.find(e => e.name === o.employee);
    const color = emp?.color || 'blue';
    return `
      <tr${o.user ? ' style="background:var(--ok-soft)"' : ''}>
        <td><div class="row-avatar"><div class="av ${color}">${LIBERTY.initials(o.employee)}</div>
          <div><div class="nm">${o.employee}${o.user ? ' <span class="pill ok" style="margin-left:4px">New</span>' : ''}</div></div></div></td>
        <td>${o.dept}</td>
        <td class="mono small">${o.date}</td>
        <td class="num fw-semibold">${o.hours}</td>
        <td class="num mono">${LIBERTY.money(o.rate)}</td>
        <td class="num mono fw-bold text-success">+${LIBERTY.money(o.amount)}</td>
        <td><span class="pill ${o.status === 'approved' ? 'ok' : 'warn'}">${o.status[0].toUpperCase() + o.status.slice(1)}</span></td>
      </tr>`;
  }).join('');
}

function calcAmt() {
  const h = parseFloat(document.getElementById('f-hours').value) || 0;
  const r = parseFloat(document.getElementById('f-rate').value) || 0;
  document.getElementById('f-amt').textContent = LIBERTY.money(Math.round(h * r));
}
function openAdd() {
  document.getElementById('f-hours').value = 2;
  document.getElementById('f-rate').value = 85;
  document.getElementById('f-err').style.display = 'none';
  calcAmt();
  addModal.show();
}
function submitOt() {
  const employee = document.getElementById('f-emp').value;
  const date = document.getElementById('f-date').value;
  const hours = parseFloat(document.getElementById('f-hours').value) || 0;
  const rate = parseFloat(document.getElementById('f-rate').value) || 0;
  const err = document.getElementById('f-err');
  if (!employee || !date || hours <= 0 || rate <= 0) { err.textContent = 'Pick an employee, date, hours and rate.'; err.style.display = 'block'; return; }
  const dept = (LIBERTY.employees.find(e => e.name === employee) || {}).dept || '—';
  const list = stored();
  list.push({ employee, dept, date, hours, rate, status: 'pending' });
  saveStored(list);
  render();
  addModal.hide();
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('f-emp').innerHTML = LIBERTY.employees.map(e => `<option>${e.name}</option>`).join('');
  addModal = new bootstrap.Modal('#addModal');
  render();
});
</script>
</body>
</html>
