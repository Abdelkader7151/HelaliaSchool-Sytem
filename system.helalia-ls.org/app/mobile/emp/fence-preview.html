<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Helalia check-in area · local preview</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; font-family: "Plus Jakarta Sans", sans-serif; }
    #map { height: 100%; }
    .panel {
      position: absolute; z-index: 1000; left: 12px; right: 12px; top: 12px;
      padding: 12px 14px; border-radius: 16px; background: #112c5a; color: #eed484;
      box-shadow: 0 12px 28px rgb(0 0 0 / .28); max-width: 420px;
    }
    .panel strong { display: block; font-size: 1.05rem; }
    .panel span { font-size: .82rem; color: #fff; opacity: .85; }
  </style>
</head>
<body>
  <div class="panel">
    <strong>Helalia check-in · 25.96 m circle</strong>
    <span>31.1774369, 29.9892744 · local preview only · not live</span>
  </div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var lat = 31.1774369, lng = 29.9892744, r = 25.96;
    var map = L.map('map').setView([lat, lng], 19);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 19
    }).addTo(map);
    L.circle([lat, lng], { radius: r, color: '#c9a227', weight: 3, fillColor: '#eed484', fillOpacity: 0.35 }).addTo(map);
    L.circleMarker([lat, lng], { radius: 7, color: '#eed484', fillColor: '#112c5a', fillOpacity: 1, weight: 3 }).addTo(map);
  </script>
</body>
</html>
