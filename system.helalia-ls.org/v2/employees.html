<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Employees · HLS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-page="employees" data-title="Employees" data-sub="Complete staff database">

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="content-wrap">
    <div id="topbar-mount"></div>

    <div class="page">

      <div id="scope-banner"></div>

      <div class="page-head">
        <div class="d-flex gap-2 align-items-center flex-grow-1 flex-wrap">
          <div class="chip-row" id="chips"></div>
        </div>
        <div class="d-flex gap-2">
          <div class="position-relative" style="min-width:240px;">
            <i class="fa-solid fa-magnifying-glass position-absolute" style="left:12px;top:50%;transform:translateY(-50%);color:var(--ink-4);font-size:12px;"></i>
            <input id="search" class="form-control ps-4" placeholder="Search by name, role, ID…">
          </div>
          <button class="btn btn-light-2"><i class="fa-solid fa-download me-1"></i> Export</button>
          <a href="employee-form.html" class="btn btn-primary" data-perm="edit"><i class="fa-solid fa-plus me-1"></i> New employee</a>
        </div>
      </div>

      <div class="table-wrap">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th>Employee</th>
              <th>Role</th>
              <th>Section</th>
              <th>Manager</th>
              <th>Start date</th>
              <th>Status</th>
              <th class="num">File #</th>
              <th class="num"></th>
            </tr>
          </thead>
          <tbody id="emp-tbody"></tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3">
        <div class="muted small">
          Showing <span id="count">30</span> of 30 employees
        </div>
        <nav>
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item disabled"><a class="page-link" href="#"><i class="fa-solid fa-chevron-left"></i></a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#"><i class="fa-solid fa-chevron-right"></i></a></li>
          </ul>
        </nav>
      </div>

    </div>
  </div>
</div>

<!-- Quick view modal -->
<div class="modal fade" id="empModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" id="empModalBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/permissions.js"></script>
<script src="assets/js/shell.js"></script>
<script>
let activeDept = 'all';
let searchTerm = '';

function statusPill(s) {
  if (s === 'Permanent') return '<span class="pill ok">Permanent</span>';
  if (s === 'Probation') return '<span class="pill warn">Probation</span>';
  return `<span class="pill muted">${s}</span>`;
}

function render() {
  const tbody = document.getElementById('emp-tbody');
  let rows = (window.LIBERTY.visibleEmployees ? LIBERTY.visibleEmployees() : LIBERTY.employees);
  if (activeDept !== 'all') rows = rows.filter(e => e.dept.toLowerCase() === activeDept);
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    rows = rows.filter(e => e.name.toLowerCase().includes(q) || e.role.toLowerCase().includes(q) || e.fp.includes(q));
  }
  document.getElementById('count').textContent = rows.length;

  tbody.innerHTML = rows.map(e => `
    <tr>
      <td onclick="viewEmp(${e.id})" style="cursor:pointer">
        <div class="row-avatar">
          <div class="av ${e.color}">${LIBERTY.initials(e.name)}</div>
          <div>
            <div class="nm">${e.name}</div>
            <div class="meta">${e.email}</div>
          </div>
        </div>
      </td>
      <td>${e.role}</td>
      <td>${e.dept}</td>
      <td class="muted small">${e.manager}</td>
      <td class="mono small">${e.start}</td>
      <td>${statusPill(e.status)}</td>
      <td class="num mono small">${e.file}</td>
      <td class="num">
        <button class="btn btn-icon btn-light-2" onclick="viewEmp(${e.id})" title="View"><i class="fa-regular fa-eye"></i></button>
        <a class="btn btn-icon btn-light-2" href="employee-profile.html?id=${e.id}" title="Profile"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
        <a class="btn btn-icon btn-light-2" href="employee-form.html?id=${e.id}" title="Edit" data-perm="edit"><i class="fa-regular fa-pen-to-square"></i></a>
        <button class="btn btn-icon btn-light-2 text-danger" title="Delete" data-perm="delete" onclick="if(confirm('Delete '+'${e.name.replace(/'/g,"\\'")}'+'?')) this.closest('tr').remove();"><i class="fa-regular fa-trash-can"></i></button>
      </td>
    </tr>
  `).join('');
}

function viewEmp(id) {
  const e = LIBERTY.employees.find(x => x.id === id);
  if (!e) return;
  document.getElementById('empModalBody').innerHTML = `
    <div class="modal-header border-0 pb-0">
      <button class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body pt-0">
      <div class="d-flex gap-3 align-items-center pb-3 border-bottom">
        <div class="row-avatar"><div class="av ${e.color}" style="width:64px;height:64px;font-size:22px;">${LIBERTY.initials(e.name)}</div></div>
        <div>
          <div style="font-size:20px;font-weight:700;">${e.name}</div>
          <div class="muted">${e.role}</div>
          <div class="d-flex gap-2 mt-2">
            <span class="pill purple">${e.dept}</span>
            ${statusPill(e.status)}
            <span class="pill muted mono">#${e.fp}</span>
          </div>
        </div>
      </div>
      <div class="row g-3 mt-1">
        <div class="col-md-6"><div class="field-row"><div class="lbl">File #</div><div class="val mono">${e.file}</div></div></div>
        <div class="col-md-6"><div class="field-row"><div class="lbl">Manager</div><div class="val">${e.manager}</div></div></div>
        <div class="col-md-6"><div class="field-row"><div class="lbl">Start date</div><div class="val mono">${e.start}</div></div></div>
        <div class="col-md-6"><div class="field-row"><div class="lbl">Salary</div><div class="val mono">${LIBERTY.money(e.salary)}</div></div></div>
        <div class="col-md-6"><div class="field-row"><div class="lbl">Email</div><div class="val">${e.email}</div></div></div>
        <div class="col-md-6"><div class="field-row"><div class="lbl">Phone</div><div class="val mono">${e.phone}</div></div></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-light-2" data-bs-dismiss="modal">Close</button>
      <a class="btn btn-primary" href="employee-profile.html?id=${e.id}">Open full profile <i class="fa-solid fa-arrow-right ms-1"></i></a>
    </div>
  `;
  new bootstrap.Modal('#empModal').show();
}

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    if (!document.getElementById('chips')) return; // access-denied guard replaced the page
    const visible = (window.LIBERTY.visibleEmployees ? LIBERTY.visibleEmployees() : LIBERTY.employees);

    // scope banner for managers
    if (window.LIBERTY.isScopedToTeam && LIBERTY.isScopedToTeam()) {
      const u = LIBERTY.currentUser();
      document.getElementById('scope-banner').innerHTML = `
        <div class="note-row mb-3" style="display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border-radius:12px;padding:12px 14px;font-size:13px;color:#92400e;">
          <i class="fa-solid fa-user-shield" style="margin-top:2px;"></i>
          <span>You are signed in as <b>${u.name}</b> (Manager). This list is scoped to <b>your reporting line</b> — ${visible.length} staff you manage. Admins and HR see all employees.</span>
        </div>`;
    }

    // Render chips from the visible set
    const counts = { american: 0, british: 0, languages: 0 };
    visible.forEach(e => { const k = e.dept.toLowerCase(); if (counts[k] != null) counts[k]++; });
    document.getElementById('chips').innerHTML = `
      <a class="chip active" data-dept="all">All<span class="ct">${visible.length}</span></a>
      <a class="chip" data-dept="american">American<span class="ct">${counts.american}</span></a>
      <a class="chip" data-dept="british">British<span class="ct">${counts.british}</span></a>
      <a class="chip" data-dept="languages">Languages<span class="ct">${counts.languages}</span></a>
    `;
    document.querySelectorAll('.chip').forEach(c => {
      c.addEventListener('click', (ev) => {
        ev.preventDefault();
        document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
        c.classList.add('active');
        activeDept = c.dataset.dept;
        render();
      });
    });
    document.getElementById('search').addEventListener('input', (ev) => {
      searchTerm = ev.target.value;
      render();
    });
    render();
  }, 0);
});
</script>
</body>
</html>
