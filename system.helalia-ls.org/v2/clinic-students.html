<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Medical records · HLS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
<style>
  .rec-row { display:flex; align-items:center; gap:13px; padding:13px 16px; cursor:pointer; border-bottom:1px solid var(--line-2); }
  .rec-row:hover { background:var(--line-2); }
  .rec-row.active { background:var(--primary-soft); }
  .rec-row:last-child { border-bottom:none; }
  .timeline { position:relative; padding-inline-start:26px; }
  .timeline::before { content:""; position:absolute; inset-inline-start:9px; top:6px; bottom:6px; width:2px; background:var(--line); }
  .tl-item { position:relative; padding:0 0 18px; }
  .tl-dot { position:absolute; inset-inline-start:-22px; top:3px; width:12px; height:12px; border-radius:50%; border:2px solid #fff; }
  .med-flag { display:inline-flex; align-items:center; gap:5px; background:var(--err-soft); color:var(--err); border-radius:999px; padding:3px 9px; font-size:10.5px; font-weight:700; }
</style>
</head>
<body data-page="clinic-students" data-title="Medical records" data-sub="السجلات الطبية — per-student clinic history">

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="content-wrap">
    <div id="topbar-mount"></div>

    <div class="page">

      <div class="tabs-nav mb-4" id="books">
        <a href="clinic.html">Clinic visits · زيارات العيادة</a>
        <a href="clinic-students.html" class="active">Medical records · السجلات الطبية</a>
      </div>

      <div class="row g-3">
        <!-- student list -->
        <div class="col-lg-4">
          <div class="table-wrap">
            <div style="padding:12px 14px;border-bottom:1px solid var(--line);">
              <input type="search" class="form-control" id="search" placeholder="Search student…" oninput="renderList()">
            </div>
            <div id="stu-list" style="max-height:620px;overflow-y:auto;"></div>
          </div>
        </div>

        <!-- record -->
        <div class="col-lg-8">
          <div class="table-wrap p-4" id="record"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/permissions.js"></script>
<script src="assets/js/shell.js"></script>
<script>
const stageColor = { KG: 'pink', Primary: 'blue', Prep: 'amber', Secondary: 'purple' };
let selId = null;
const roster = () => window.STORE ? STORE.students() : LIBERTY.students;
const famPhone = s => (s.father && s.father.phone) || (s.mother && s.mother.phone) || '—';

function renderList() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  const list = roster().filter(s => !q || `${s.name} ${s.nameAr || ''} ${s.grade}`.toLowerCase().includes(q));
  document.getElementById('stu-list').innerHTML = list.map(s => {
    const n = LIBERTY.clinicForStudent(s.id).length;
    return `
      <div class="rec-row ${s.id === selId ? 'active' : ''}" onclick="select('${s.id}')">
        <div class="av ${stageColor[s.stage] || 'blue'}" style="width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;">${LIBERTY.initials(s.name)}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;">${s.name}</div>
          <div class="muted small">${s.stage} · ${s.grade}</div>
        </div>
        ${s.medical ? '<span class="med-flag"><i class="fa-solid fa-notes-medical" style="font-size:9px"></i></span>' : ''}
        <span class="pill ${n ? 'info' : 'muted'}">${n}</span>
      </div>`;
  }).join('') || '<div class="text-center muted" style="padding:24px">No students.</div>';
}

function select(id) { selId = id; renderList(); renderRecord(); }

function renderRecord() {
  const s = roster().find(x => x.id === selId);
  if (!s) { document.getElementById('record').innerHTML = '<div class="text-center muted" style="padding:60px">Select a student to view their medical record.</div>'; return; }
  const visits = LIBERTY.clinicForStudent(s.id);
  document.getElementById('record').innerHTML = `
    <div class="d-flex gap-3 align-items-center pb-3 border-bottom">
      <div class="av ${stageColor[s.stage] || 'blue'}" style="width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:21px;">${LIBERTY.initials(s.name)}</div>
      <div style="flex:1">
        <div style="font-size:19px;font-weight:700;">${s.name} <span class="muted" style="font-size:14px">${s.nameAr || ''}</span></div>
        <div class="muted">${s.stage} · ${s.grade} · ${s.section || ''} · ${s.id}</div>
      </div>
      <div style="text-align:end">
        <div class="muted small">Guardian (${s.guardian || '—'})</div>
        <div class="mono">${famPhone(s)}</div>
      </div>
    </div>
    ${s.medical
      ? `<div class="note mt-3" style="background:var(--err-soft);color:#b91c1c;border-radius:11px;padding:11px 14px;font-size:13px;"><i class="fa-solid fa-triangle-exclamation me-1"></i> <b>Chronic / known condition:</b> ${s.medical}</div>`
      : `<div class="note mt-3" style="background:var(--ok-soft);color:#047857;border-radius:11px;padding:11px 14px;font-size:13px;"><i class="fa-solid fa-circle-check me-1"></i> No chronic condition on file.</div>`}

    <div class="d-flex justify-content-between align-items-center mt-4 mb-2">
      <div style="font-weight:700;">Clinic history — ${visits.length} visit${visits.length === 1 ? '' : 's'}</div>
      <a href="clinic.html" class="btn btn-light-2 btn-sm" data-perm="edit"><i class="fa-solid fa-notes-medical me-1"></i> New report</a>
    </div>
    ${visits.length ? `<div class="timeline mt-3">${visits.map(tlItem).join('')}</div>`
      : '<div class="text-center muted" style="padding:30px">No clinic visits recorded for this student.</div>'}`;
}

function tlItem(v) {
  const sev = LIBERTY.SEVERITY[v.severity] || { color: '#94a3b8', pill: 'muted' };
  const outColor = v.outcome === 'Returned to class' ? 'ok' : v.outcome === 'Sent home' ? 'warn' : 'err';
  return `
    <div class="tl-item">
      <span class="tl-dot" style="background:${sev.color}"></span>
      <div class="d-flex justify-content-between align-items-start flex-wrap" style="gap:6px">
        <div style="font-weight:700;">${v.complaint}</div>
        <div class="d-flex gap-2"><span class="pill ${sev.pill}">${v.severity}</span><span class="pill ${outColor}">${v.outcome}</span></div>
      </div>
      <div class="muted small mono">${v.date} · ${v.time || ''} · ${v.seenBy}</div>
      <div class="mt-2" style="background:var(--line-2);border-radius:11px;padding:11px 13px;font-size:13px;">
        <div><b>Diagnosis:</b> ${v.diagnosis}</div>
        <div class="mt-1"><b>Vitals:</b> <span class="mono">${v.temp ?? '—'}°C · ${v.pulse ?? '—'} bpm · ${v.bp || '—'}</span></div>
        ${v.treatment ? `<div class="mt-1"><b>Treatment:</b> ${v.treatment}</div>` : ''}
        ${v.medsGiven ? `<div class="mt-1"><b>Medication:</b> ${v.medsGiven}</div>` : ''}
        ${v.followUp ? `<div class="mt-1"><b>Follow-up:</b> ${v.followUp}</div>` : ''}
        <div class="mt-1 muted">${v.parentNotified ? '<i class="fa-solid fa-bell" style="font-size:10px"></i> Parent notified' : 'Parent not notified'}</div>
      </div>
    </div>`;
}

document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    if (!document.getElementById('stu-list')) return;
    // preselect student with most visits
    const withVisits = roster().filter(s => LIBERTY.clinicForStudent(s.id).length);
    selId = (withVisits[0] || roster()[0] || {}).id || null;
    renderList();
    renderRecord();
  }, 0);
});
</script>
</body>
</html>
