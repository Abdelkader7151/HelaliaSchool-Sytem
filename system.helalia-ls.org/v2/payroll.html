<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payroll · HLS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-page="pay-history" data-title="Payroll history" data-sub="April 2026 — 30 employees">

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="content-wrap">
    <div id="topbar-mount"></div>

    <div class="page">

      <!-- Run summary -->
      <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon purple"><i class="fa-solid fa-users"></i></div><div class="kpi-label">Employees</div><div class="kpi-value">30</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon blue"><i class="fa-solid fa-money-bill-wave"></i></div><div class="kpi-label">Gross total</div><div class="kpi-value mono" style="font-size:22px;">EGP 327,100</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon amber"><i class="fa-solid fa-receipt"></i></div><div class="kpi-label">Deductions</div><div class="kpi-value mono" style="font-size:22px;">EGP 41,680</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon green"><i class="fa-solid fa-circle-check"></i></div><div class="kpi-label">Net payable</div><div class="kpi-value mono" style="font-size:22px;color:var(--ok);">EGP 285,420</div></div></div>
      </div>

      <!-- Toolbar -->
      <div class="page-head">
        <div class="d-flex gap-2 align-items-center">
          <select class="form-select" style="max-width:220px;">
            <option>April 2026</option>
            <option>March 2026</option>
            <option>February 2026</option>
            <option>January 2026</option>
          </select>
          <span class="pill ok">Paid</span>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-light-2"><i class="fa-solid fa-print me-1"></i> Print</button>
          <button class="btn btn-light-2"><i class="fa-solid fa-file-excel me-1"></i> Export</button>
          <button class="btn btn-primary"><i class="fa-solid fa-play me-1"></i> Run new payroll</button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="table mb-0 align-middle">
          <thead>
            <tr>
              <th>Employee</th>
              <th>Section</th>
              <th class="num">Basic</th>
              <th class="num">Allowances</th>
              <th class="num">Overtime</th>
              <th class="num">Deductions</th>
              <th class="num">Net</th>
              <th class="num"></th>
            </tr>
          </thead>
          <tbody id="payroll-tbody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- Payslip modal -->
<div class="modal fade" id="payslipModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content" id="payslipBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/permissions.js"></script>
<script src="assets/js/shell.js"></script>
<script>
function row(e) {
  const allowance = Math.round(e.salary * 0.15);
  const overtime  = Math.round(e.salary * 0.03);
  const deduction = Math.round(e.salary * 0.12);
  const net       = e.salary + allowance + overtime - deduction;
  return { ...e, allowance, overtime, deduction, net };
}

document.addEventListener('DOMContentLoaded', () => {
  const tbody = document.getElementById('payroll-tbody');
  tbody.innerHTML = LIBERTY.employees.map(emp => {
    const e = row(emp);
    return `
      <tr style="cursor:pointer" onclick="showPayslip(${e.id})">
        <td>
          <div class="row-avatar">
            <div class="av ${e.color}">${LIBERTY.initials(e.name)}</div>
            <div><div class="nm">${e.name}</div><div class="meta">${e.role}</div></div>
          </div>
        </td>
        <td>${e.dept}</td>
        <td class="num mono">${LIBERTY.money(e.salary)}</td>
        <td class="num mono text-success">+${LIBERTY.money(e.allowance)}</td>
        <td class="num mono text-success">+${LIBERTY.money(e.overtime)}</td>
        <td class="num mono text-danger">-${LIBERTY.money(e.deduction)}</td>
        <td class="num mono fw-bold">${LIBERTY.money(e.net)}</td>
        <td class="num">
          <button class="btn btn-icon btn-light-2" title="View payslip"><i class="fa-regular fa-eye"></i></button>
        </td>
      </tr>
    `;
  }).join('');
});

function showPayslip(id) {
  const e = row(LIBERTY.employees.find(x => x.id === id));
  document.getElementById('payslipBody').innerHTML = `
    <div class="modal-header" style="background:linear-gradient(135deg,#1e293b,#312e81);color:#fff;">
      <div>
        <div style="font-size:18px;font-weight:700;">Payslip — April 2026</div>
        <div class="opacity-75 small mt-1">Helalia Language School · Generated 2026-04-30</div>
      </div>
      <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body p-0">
      <div class="p-4 border-bottom d-flex gap-3 align-items-center">
        <div class="row-avatar"><div class="av ${e.color}" style="width:54px;height:54px;font-size:18px;">${LIBERTY.initials(e.name)}</div></div>
        <div class="flex-grow-1">
          <div style="font-size:17px;font-weight:700;">${e.name}</div>
          <div class="muted">${e.role} · ${e.dept}</div>
        </div>
        <div class="text-end">
          <div class="muted small">File #</div>
          <div class="mono fw-bold">${e.file}</div>
        </div>
      </div>
      <div class="p-4">
        <div class="row g-4">
          <div class="col-md-6">
            <div style="font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Earnings</div>
            <div class="d-flex justify-content-between border-bottom py-2 small"><span>Basic salary</span><span class="mono">${LIBERTY.money(e.salary)}</span></div>
            <div class="d-flex justify-content-between border-bottom py-2 small"><span>Transport allowance</span><span class="mono">${LIBERTY.money(Math.round(e.allowance*0.4))}</span></div>
            <div class="d-flex justify-content-between border-bottom py-2 small"><span>Housing allowance</span><span class="mono">${LIBERTY.money(Math.round(e.allowance*0.6))}</span></div>
            <div class="d-flex justify-content-between border-bottom py-2 small"><span>Overtime</span><span class="mono">${LIBERTY.money(e.overtime)}</span></div>
            <div class="d-flex justify-content-between py-2 small fw-bold"><span>Total</span><span class="mono">${LIBERTY.money(e.salary + e.allowance + e.overtime)}</span></div>
          </div>
          <div class="col-md-6">
            <div style="font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Deductions</div>
            <div class="d-flex justify-content-between border-bottom py-2 small"><span>Social insurance</span><span class="mono text-danger">-${LIBERTY.money(Math.round(e.deduction*0.5))}</span></div>
            <div class="d-flex justify-content-between border-bottom py-2 small"><span>Income tax</span><span class="mono text-danger">-${LIBERTY.money(Math.round(e.deduction*0.4))}</span></div>
            <div class="d-flex justify-content-between border-bottom py-2 small"><span>Other</span><span class="mono text-danger">-${LIBERTY.money(Math.round(e.deduction*0.1))}</span></div>
            <div class="d-flex justify-content-between py-2 small fw-bold"><span>Total</span><span class="mono text-danger">-${LIBERTY.money(e.deduction)}</span></div>
          </div>
        </div>
      </div>
      <div class="p-4 border-top d-flex justify-content-between align-items-center" style="background:var(--line-2);">
        <div>
          <div class="muted small">Net payable</div>
          <div style="font-size:24px;font-weight:700;" class="mono">${LIBERTY.money(e.net)}</div>
        </div>
        <span class="pill ok">Paid · 2026-04-28</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-light-2" data-bs-dismiss="modal">Close</button>
      <button class="btn btn-light-2"><i class="fa-solid fa-envelope me-1"></i> Email</button>
      <button class="btn btn-primary"><i class="fa-solid fa-print me-1"></i> Print payslip</button>
    </div>
  `;
  new bootstrap.Modal('#payslipModal').show();
}
</script>
</body>
</html>
