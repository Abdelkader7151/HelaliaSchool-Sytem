<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New leave request · HLS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-page="leaves" data-title="New leave request" data-sub="Leaves · Add">

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="content-wrap">
    <div id="topbar-mount"></div>

    <div class="page">

      <div class="d-flex align-items-center mb-3">
        <a href="leaves.html" class="btn btn-light-2 btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Back to leaves</a>
      </div>

      <div class="row g-3">
        <div class="col-lg-7">
          <form onsubmit="event.preventDefault(); alert('Leave request submitted (mockup — no backend)'); window.location='leaves.html';">
            <div class="card">
              <div class="card-head"><h2 class="card-title">Request details</h2></div>
              <div class="card-body">
                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label">Employee *</label>
                    <select class="form-select" id="f-emp" required>
                      <option value="">Select employee…</option>
                    </select>
                  </div>
                  <div class="col-md-12">
                    <label class="form-label">Leave type *</label>
                    <div class="row g-2">
                      <div class="col">
                        <input type="radio" class="btn-check" name="type" id="t-annual" checked>
                        <label class="btn btn-light-2 w-100 text-start" for="t-annual">
                          <i class="fa-solid fa-umbrella-beach me-2 text-primary"></i>
                          Annual
                          <div class="muted small">14 / 21 left</div>
                        </label>
                      </div>
                      <div class="col">
                        <input type="radio" class="btn-check" name="type" id="t-sick">
                        <label class="btn btn-light-2 w-100 text-start" for="t-sick">
                          <i class="fa-solid fa-briefcase-medical me-2 text-info"></i>
                          Sick
                          <div class="muted small">11 / 14 left</div>
                        </label>
                      </div>
                      <div class="col">
                        <input type="radio" class="btn-check" name="type" id="t-casual">
                        <label class="btn btn-light-2 w-100 text-start" for="t-casual">
                          <i class="fa-solid fa-mug-hot me-2 text-warning"></i>
                          Casual
                          <div class="muted small">5 / 7 left</div>
                        </label>
                      </div>
                      <div class="col">
                        <input type="radio" class="btn-check" name="type" id="t-other">
                        <label class="btn btn-light-2 w-100 text-start" for="t-other">
                          <i class="fa-solid fa-circle-question me-2"></i>
                          Other
                          <div class="muted small">unpaid</div>
                        </label>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">From *</label>
                    <input type="date" class="form-control" required value="2026-05-04" id="f-from">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">To *</label>
                    <input type="date" class="form-control" required value="2026-05-06" id="f-to">
                  </div>
                  <div class="col-md-12">
                    <label class="form-label">Reason</label>
                    <textarea class="form-control" rows="4" placeholder="Briefly describe the reason…"></textarea>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Attach document (optional)</label>
                    <input type="file" class="form-control">
                    <div class="muted small mt-1">Useful for sick leaves — medical certificate, etc.</div>
                  </div>
                </div>
              </div>
              <div class="card-body border-top d-flex gap-2 justify-content-end">
                <a href="leaves.html" class="btn btn-light-2">Cancel</a>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane me-1"></i> Submit request</button>
              </div>
            </div>
          </form>
        </div>

        <div class="col-lg-5">
          <div class="card">
            <div class="card-head"><h2 class="card-title">Summary</h2></div>
            <div class="card-body">
              <div class="text-center py-3">
                <div class="kpi-icon purple mx-auto mb-2" style="width:54px;height:54px;font-size:22px;"><i class="fa-solid fa-calendar-day"></i></div>
                <div style="font-size:30px;font-weight:700;" id="day-count">3</div>
                <div class="muted">Total days requested</div>
              </div>
              <hr>
              <div class="d-flex justify-content-between small mb-2"><span class="muted">From</span><span class="mono fw-semibold" id="s-from">2026-05-04</span></div>
              <div class="d-flex justify-content-between small mb-2"><span class="muted">To</span><span class="mono fw-semibold" id="s-to">2026-05-06</span></div>
              <div class="d-flex justify-content-between small mb-2"><span class="muted">Working days</span><span class="fw-semibold">3</span></div>
              <div class="d-flex justify-content-between small mb-2"><span class="muted">Returns on</span><span class="mono fw-semibold">2026-05-07</span></div>
              <hr>
              <div class="alert alert-info small mb-0">
                <i class="fa-solid fa-info-circle me-1"></i>
                Approval required from <strong>Employee 1</strong> before leave starts.
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/permissions.js"></script>
<script src="assets/js/shell.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const sel = document.getElementById('f-emp');
    LIBERTY.employees.forEach(e => {
      sel.insertAdjacentHTML('beforeend', `<option value="${e.id}">${e.name} · ${e.role}</option>`);
    });
    function recalc() {
      const a = new Date(document.getElementById('f-from').value);
      const b = new Date(document.getElementById('f-to').value);
      const days = Math.max(1, Math.round((b - a) / 86400000) + 1);
      document.getElementById('day-count').textContent = days;
      document.getElementById('s-from').textContent = document.getElementById('f-from').value;
      document.getElementById('s-to').textContent = document.getElementById('f-to').value;
    }
    document.getElementById('f-from').addEventListener('change', recalc);
    document.getElementById('f-to').addEventListener('change', recalc);
  });
</script>
</body>
</html>
