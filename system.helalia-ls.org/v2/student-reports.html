<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student reports · HLS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://cdn.datatables.net/2.1.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">
<link href="https://cdn.datatables.net/buttons/3.2.0/css/buttons.bootstrap5.min.css" rel="stylesheet">
<link href="https://cdn.datatables.net/rowgroup/1.5.1/css/rowGroup.bootstrap5.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
<style>
  /* DataTables fit inside the app's card styling */
  div.dt-container { font-size: 13px; }
  div.dt-container .dt-buttons .btn { margin-inline-end: 6px; }
  table.dataTable thead th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); }
  tr.dtrg-group td { background: var(--primary-soft) !important; font-weight: 700; color: var(--ink); }
  .dt-search input { border-radius: 9px !important; }
  .stage-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .arname { font-family: 'Cairo', sans-serif; }
</style>
</head>
<body data-page="student-reports" data-title="Student reports" data-sub="التقارير — stages & enrolment">

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="content-wrap">
    <div id="topbar-mount"></div>

    <div class="page">

      <div class="tabs-nav mb-4" id="books">
        <a href="students.html">Students · الطلبة</a>
        <a href="classes.html">Classes · الفصول</a>
        <a href="subjects.html">Subjects · المواد</a>
        <a href="second-language.html">Second language · اللغة الثانية</a>
        <a href="student-vacations.html">Vacations · الإجازات</a>
        <a href="student-reports.html" class="active">Reports · التقارير</a>
        <a href="student-search.html">Search · بحث</a>
      </div>

      <div class="stage-strip mb-4" id="stage-strip"></div>

      <div class="page-head">
        <div class="d-flex gap-2 align-items-center flex-wrap">
          <span style="font-weight:600;">Students by stage — الطلبة حسب المرحلة</span>
          <select class="form-select" id="f-stage" style="max-width:170px;"><option value="">All stages</option><option>KG</option><option>Primary</option><option>Prep</option><option>Secondary</option></select>
          <select class="form-select" id="f-section" style="max-width:160px;"><option value="">All sections</option><option>American</option><option>British</option><option>Languages</option></select>
        </div>
      </div>

      <div class="table-wrap p-3">
        <table id="tbl" class="table align-middle" style="width:100%">
          <thead>
            <tr>
              <th>Name (EN)</th><th>الاسم بالعربي</th><th>Stage</th><th>Grade</th>
              <th>Section</th><th>Family</th><th>Guardian</th><th>Arrival</th><th>Bus</th><th>Medical</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
<script src="https://cdn.datatables.net/2.1.8/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/3.2.0/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/3.2.0/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/3.2.0/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/3.2.0/js/buttons.print.min.js"></script>
<script src="https://cdn.datatables.net/buttons/3.2.0/js/buttons.colVis.min.js"></script>
<script src="https://cdn.datatables.net/rowgroup/1.5.1/js/dataTables.rowGroup.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/permissions.js"></script>
<script src="assets/js/shell.js"></script>
<script>
const STAGE_ORDER = { KG: 1, Primary: 2, Prep: 3, Secondary: 4 };
const stageColor = { KG: 'pink', Primary: 'blue', Prep: 'amber', Secondary: 'purple' };
const famName = id => (LIBERTY.families.find(f => f.id === id) || {}).name || '—';

function buildRows() {
  const list = LIBERTY.roster();
  document.getElementById('tbody').innerHTML = list.map(s => {
    const bus = s.arrival === 'Bus' ? LIBERTY.busById(s.busId) : null;
    return `
      <tr>
        <td>${s.name}</td>
        <td class="arname" dir="rtl">${s.nameAr || '—'}</td>
        <td>${s.stage}</td>
        <td>${s.grade || '—'}</td>
        <td>${s.section || '—'}</td>
        <td>${famName(s.familyId)}</td>
        <td>${s.guardian || '—'}</td>
        <td>${s.arrival || '—'}</td>
        <td>${bus ? bus.label : '—'}</td>
        <td>${s.medical ? 'Yes' : 'None'}</td>
      </tr>`;
  }).join('');
}

function buildStrip() {
  const list = LIBERTY.roster();
  const stages = ['KG', 'Primary', 'Prep', 'Secondary'];
  document.getElementById('stage-strip').innerHTML = stages.map(st => {
    const n = list.filter(s => s.stage === st).length;
    return `<div class="kpi"><div class="kpi-icon ${stageColor[st]}"><i class="fa-solid fa-graduation-cap"></i></div>
      <div class="kpi-label">${st}</div><div class="kpi-value">${n}</div></div>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  // logical stage ordering (KG < Primary < Prep < Secondary) on the stage column
  DataTable.ext.type.order['stage-pre'] = d => STAGE_ORDER[d] || 9;
  buildStrip();
  buildRows();

  const table = new DataTable('#tbl', {
    dom: "<'row mb-3'<'col-sm-7'B><'col-sm-5'f>>rt<'row mt-3'<'col-sm-5'i><'col-sm-7'p>>",
    pageLength: 25,
    order: [[2, 'asc'], [0, 'asc']],
    columnDefs: [{ targets: 2, visible: false, type: 'stage' }],
    rowGroup: {
      dataSrc: 2,
      startRender: (rows, group) =>
        $('<tr/>').append(`<td colspan="9"><i class="fa-solid fa-graduation-cap me-2"></i>${group} — ${rows.count()} student${rows.count() > 1 ? 's' : ''}</td>`)
    },
    buttons: [
      { extend: 'excelHtml5', text: '<i class="fa-solid fa-file-excel me-1"></i> Excel', className: 'btn btn-light-2 btn-sm', title: 'Students by stage' },
      { extend: 'pdfHtml5', text: '<i class="fa-solid fa-file-pdf me-1"></i> PDF', className: 'btn btn-light-2 btn-sm', title: 'Students by stage', orientation: 'landscape', pageSize: 'A4' },
      { extend: 'print', text: '<i class="fa-solid fa-print me-1"></i> Print', className: 'btn btn-light-2 btn-sm' },
      { extend: 'colvis', text: '<i class="fa-solid fa-table-columns me-1"></i> Columns', className: 'btn btn-light-2 btn-sm' }
    ]
  });

  document.getElementById('f-stage').addEventListener('change', function () {
    table.column(2).search(this.value ? '^' + this.value + '$' : '', true, false).draw();
  });
  document.getElementById('f-section').addEventListener('change', function () {
    table.column(4).search(this.value ? '^' + this.value + '$' : '', true, false).draw();
  });
});
</script>
</body>
</html>
