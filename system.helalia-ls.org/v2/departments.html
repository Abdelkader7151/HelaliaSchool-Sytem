<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Departments · HLS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-page="departments" data-title="Departments &amp; Sections" data-sub="Organize your school structure">

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="content-wrap">
    <div id="topbar-mount"></div>

    <div class="page">

      <div class="page-head">
        <div></div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#deptModal"><i class="fa-solid fa-plus me-1"></i> New department</button>
      </div>

      <div class="row g-3" id="dept-cards"></div>

    </div>
  </div>
</div>

<!-- Add department modal -->
<div class="modal fade" id="deptModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">New department</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form>
          <div class="mb-3"><label class="form-label">Department name *</label><input class="form-control" placeholder="e.g. IB Track"></div>
          <div class="mb-3"><label class="form-label">Code</label><input class="form-control mono" placeholder="ib"></div>
          <div class="mb-3"><label class="form-label">Department head</label>
            <select class="form-select"><option>Select…</option><option>Employee 1</option><option>Employee 3</option><option>Employee 2</option></select>
          </div>
          <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" rows="2"></textarea></div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-light-2" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" data-bs-dismiss="modal">Create department</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/permissions.js"></script>
<script src="assets/js/shell.js"></script>
<script>
const colorMap = { american:'purple', british:'pink', languages:'green' };
const iconMap  = { american:'fa-flag-usa', british:'fa-monument', languages:'fa-language' };

document.addEventListener('DOMContentLoaded', () => {
  const wrap = document.getElementById('dept-cards');
  wrap.innerHTML = LIBERTY.departments.map(d => {
    const head = LIBERTY.employees.find(e => e.name === d.head);
    const members = LIBERTY.employees.filter(e => e.dept.toLowerCase() === d.code).slice(0, 6);
    const more = LIBERTY.employees.filter(e => e.dept.toLowerCase() === d.code).length - members.length;
    const color = colorMap[d.code] || 'purple';
    return `
      <div class="col-md-6 col-xl-4">
        <div class="card h-100">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-3">
              <div class="kpi-icon ${color}" style="width:48px;height:48px;font-size:18px;"><i class="fa-solid ${iconMap[d.code] || 'fa-building'}"></i></div>
              <div class="dropdown">
                <button class="btn btn-icon btn-light-2" data-bs-toggle="dropdown"><i class="fa-solid fa-ellipsis"></i></button>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li><a class="dropdown-item" href="#"><i class="fa-regular fa-pen-to-square me-2"></i> Edit</a></li>
                  <li><a class="dropdown-item" href="employees.html"><i class="fa-solid fa-users me-2"></i> View staff</a></li>
                  <li><hr class="dropdown-divider"></li>
                  <li><a class="dropdown-item text-danger" href="#"><i class="fa-regular fa-trash-can me-2"></i> Delete</a></li>
                </ul>
              </div>
            </div>
            <div style="font-size:18px;font-weight:700;">${d.name}</div>
            <div class="muted small mb-3">Code: <code class="mono">${d.code}</code></div>

            <div class="d-flex gap-3 py-3 border-top border-bottom mb-3">
              <div class="flex-fill">
                <div class="muted small">Staff</div>
                <div style="font-size:20px;font-weight:700;">${d.staff}</div>
              </div>
              <div class="flex-fill">
                <div class="muted small">Head</div>
                <div class="fw-semibold small">${d.head}</div>
              </div>
            </div>

            <div class="muted small mb-2">Team</div>
            <div class="d-flex">
              ${members.map((m, i) => `
                <div class="av ${m.color}" style="width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;border:2px solid #fff;margin-left:${i === 0 ? 0 : '-8px'};" title="${m.name}">
                  ${LIBERTY.initials(m.name)}
                </div>
              `).join('')}
              ${more > 0 ? `<div class="av muted" style="width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;border:2px solid #fff;margin-left:-8px;background:var(--line-2);color:var(--ink-3);">+${more}</div>` : ''}
            </div>

            <a href="employees.html" class="btn btn-light-2 btn-sm w-100 mt-3">View all staff <i class="fa-solid fa-arrow-right ms-1"></i></a>
          </div>
        </div>
      </div>
    `;
  }).join('');
});
</script>
</body>
</html>
