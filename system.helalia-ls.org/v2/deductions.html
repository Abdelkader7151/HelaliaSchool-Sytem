<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deductions & Penalties · HLS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-page="deductions" data-title="Deductions & Penalties" data-sub="الخصومات والجزاءات — May 2026">

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="content-wrap">
    <div id="topbar-mount"></div>

    <div class="page">

      <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon" style="background:var(--err-soft);color:var(--err)"><i class="fa-solid fa-circle-minus"></i></div><div class="kpi-label">Total deductions</div><div class="kpi-value mono" id="k-total" style="font-size:22px;">EGP 0</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon amber"><i class="fa-solid fa-user-clock"></i></div><div class="kpi-label">Absence / late</div><div class="kpi-value mono" id="k-abs" style="font-size:22px;">EGP 0</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon purple"><i class="fa-solid fa-gavel"></i></div><div class="kpi-label">Penalties</div><div class="kpi-value" id="k-pen">0</div></div></div>
        <div class="col-md-3"><div class="kpi"><div class="kpi-icon blue"><i class="fa-solid fa-users"></i></div><div class="kpi-label">Employees affected</div><div class="kpi-value" id="k-emp">0</div></div></div>
      </div>

      <div class="page-head">
        <div class="d-flex gap-2 align-items-center">
          <span style="font-weight:600;">Deductions &amp; penalties</span>
          <span class="pill info">Feeds the payroll engine</span>
        </div>
        <div class="d-flex gap-2">
          <a href="payroll-officer.html" class="btn btn-light-2"><i class="fa-solid fa-calculator me-1"></i> Payroll engine</a>
          <button class="btn btn-primary" onclick="openAdd()"><i class="fa-solid fa-plus me-1"></i> Add deduction</button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="table mb-0 align-middle">
          <thead>
            <tr>
              <th>Employee</th><th>Section</th><th>Type</th><th>Reason</th>
              <th class="num">Qty</th><th class="num">Amount</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<!-- Add deduction modal -->
<div class="modal fade" id="addModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <div><div class="card-title">Add deduction / penalty</div><div class="card-sub">إضافة خصم أو جزاء</div></div>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label">Employee</label><select class="form-select" id="f-emp"></select></div>
        <div class="row g-3">
          <div class="col-6"><label class="form-label">Type</label>
            <select class="form-select" id="f-type">
              <option value="Absence">Absence — غياب</option>
              <option value="Late">Late — تأخير</option>
              <option value="Penalty">Penalty — جزاء</option>
              <option value="Loan">Loan / advance — سلفة</option>
            </select></div>
          <div class="col-6"><label class="form-label">Quantity</label><input type="text" class="form-control" id="f-qty" placeholder="e.g. 1 day / 3 times"></div>
          <div class="col-12"><label class="form-label">Reason</label><input type="text" class="form-control" id="f-reason" placeholder="e.g. Unexcused absence"></div>
          <div class="col-6"><label class="form-label">Amount (EGP)</label><input type="number" class="form-control mono" id="f-amount" min="0" placeholder="0"></div>
          <div class="col-6"><label class="form-label">Status</label>
            <select class="form-select" id="f-status"><option value="pending">Pending</option><option value="applied">Applied</option></select></div>
        </div>
        <div class="text-danger small mt-2" id="f-err" style="display:none;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-light-2" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="submitDed()"><i class="fa-solid fa-check me-1"></i> Add deduction</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/permissions.js"></script>
<script src="assets/js/shell.js"></script>
<script>
const KEY = 'liberty_deduction_add';
const typeColor = { Absence: 'amber', Late: 'warn', Penalty: 'purple', Loan: 'info' };
let addModal;
const stored = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (_) { return []; } };
const saveStored = a => localStorage.setItem(KEY, JSON.stringify(a));
const allRows = () => LIBERTY.penalties.concat(stored().map(p => ({ ...p, user: true })));

function render() {
  const p = allRows();
  document.getElementById('k-total').textContent = LIBERTY.money(p.reduce((s, x) => s + x.amount, 0));
  document.getElementById('k-abs').textContent   = LIBERTY.money(p.filter(x => x.type === 'Absence' || x.type === 'Late').reduce((s, x) => s + x.amount, 0));
  document.getElementById('k-pen').textContent   = p.filter(x => x.type === 'Penalty').length;
  document.getElementById('k-emp').textContent   = new Set(p.map(x => x.employee)).size;

  document.getElementById('tbody').innerHTML = p.map(x => {
    const emp = LIBERTY.employees.find(e => e.name === x.employee);
    const color = emp?.color || 'amber';
    return `
      <tr${x.user ? ' style="background:var(--ok-soft)"' : ''}>
        <td><div class="row-avatar"><div class="av ${color}">${LIBERTY.initials(x.employee)}</div>
          <div><div class="nm">${x.employee}${x.user ? ' <span class="pill ok" style="margin-left:4px">New</span>' : ''}</div></div></div></td>
        <td>${x.dept}</td>
        <td><span class="pill ${typeColor[x.type] || 'muted'}">${x.type}</span></td>
        <td class="muted small">${x.reason}</td>
        <td class="num small">${x.qty}</td>
        <td class="num mono fw-bold text-danger">-${LIBERTY.money(x.amount)}</td>
        <td><span class="pill ${x.status === 'applied' ? 'ok' : 'warn'}">${x.status[0].toUpperCase() + x.status.slice(1)}</span></td>
      </tr>`;
  }).join('');
}

function openAdd() {
  document.getElementById('f-qty').value = '';
  document.getElementById('f-reason').value = '';
  document.getElementById('f-amount').value = '';
  document.getElementById('f-err').style.display = 'none';
  addModal.show();
}
function submitDed() {
  const employee = document.getElementById('f-emp').value;
  const type = document.getElementById('f-type').value;
  const qty = document.getElementById('f-qty').value.trim() || '1';
  const reason = document.getElementById('f-reason').value.trim();
  const amount = Math.round(parseFloat(document.getElementById('f-amount').value) || 0);
  const status = document.getElementById('f-status').value;
  const err = document.getElementById('f-err');
  if (!employee || !reason || amount <= 0) { err.textContent = 'Pick an employee, reason and a valid amount.'; err.style.display = 'block'; return; }
  const dept = (LIBERTY.employees.find(e => e.name === employee) || {}).dept || '—';
  const list = stored();
  list.push({ employee, dept, type, reason, qty, amount, status });
  saveStored(list);
  render();
  addModal.hide();
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('f-emp').innerHTML = LIBERTY.employees.map(e => `<option>${e.name}</option>`).join('');
  addModal = new bootstrap.Modal('#addModal');
  render();
});
</script>
</body>
</html>
