<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add employee · HLS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body data-page="employees" data-title="New employee" data-sub="Employees · Add new">

<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="content-wrap">
    <div id="topbar-mount"></div>

    <div class="page" id="form-page">

      <div class="d-flex align-items-center mb-3">
        <a href="employees.html" class="btn btn-light-2 btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
      </div>

      <form onsubmit="event.preventDefault(); alert('Saved (mockup — no backend)'); window.location='employees.html';">

        <div class="row g-3">
          <div class="col-lg-8">

            <div class="card mb-3">
              <div class="card-head"><h2 class="card-title">Personal information</h2></div>
              <div class="card-body">
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label">First name *</label><input class="form-control" id="f-first" required></div>
                  <div class="col-md-6"><label class="form-label">Last name *</label><input class="form-control" id="f-last" required></div>
                  <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" id="f-email"></div>
                  <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" id="f-phone" placeholder="01000000000"></div>
                  <div class="col-md-6"><label class="form-label">National ID</label><input class="form-control" maxlength="14"></div>
                  <div class="col-md-6"><label class="form-label">Birth date</label><input type="date" class="form-control"></div>
                  <div class="col-md-6"><label class="form-label">Gender</label>
                    <select class="form-select"><option>Male</option><option>Female</option></select>
                  </div>
                  <div class="col-md-6"><label class="form-label">Marital status</label>
                    <select class="form-select"><option>Single</option><option>Married</option><option>Divorced</option><option>Widowed</option></select>
                  </div>
                  <div class="col-12"><label class="form-label">Address</label><input class="form-control"></div>
                </div>
              </div>
            </div>

            <div class="card mb-3">
              <div class="card-head"><h2 class="card-title">Employment</h2></div>
              <div class="card-body">
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label">Job title *</label><input class="form-control" required placeholder="e.g. English Teacher"></div>
                  <div class="col-md-6"><label class="form-label">Section *</label>
                    <select class="form-select"><option>American</option><option>British</option><option>Languages</option></select>
                  </div>
                  <div class="col-md-6"><label class="form-label">Manager</label>
                    <select class="form-select"><option>—</option><option>Employee 1</option><option>Employee 3</option><option>Employee 2</option></select>
                  </div>
                  <div class="col-md-6"><label class="form-label">Start date *</label><input type="date" class="form-control" required></div>
                  <div class="col-md-6"><label class="form-label">Status</label>
                    <select class="form-select"><option>Probation</option><option>Permanent</option><option>Contract</option></select>
                  </div>
                  <div class="col-md-6"><label class="form-label">Fingerprint code</label><input class="form-control mono" placeholder="1031"></div>
                  <div class="col-md-6"><label class="form-label">File number</label><input class="form-control mono" placeholder="F-031"></div>
                  <div class="col-md-6"><label class="form-label">Working hours</label>
                    <select class="form-select"><option>Full time (8h)</option><option>Part time (4h)</option></select>
                  </div>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-head"><h2 class="card-title">Compensation</h2></div>
              <div class="card-body">
                <div class="row g-3">
                  <div class="col-md-4"><label class="form-label">Basic salary (EGP)</label><input type="number" class="form-control mono" placeholder="10000"></div>
                  <div class="col-md-4"><label class="form-label">Transport allowance</label><input type="number" class="form-control mono" placeholder="500"></div>
                  <div class="col-md-4"><label class="form-label">Housing allowance</label><input type="number" class="form-control mono" placeholder="1000"></div>
                  <div class="col-md-4"><label class="form-label">Bank name</label><input class="form-control" placeholder="CIB"></div>
                  <div class="col-md-8"><label class="form-label">IBAN / Account number</label><input class="form-control mono" placeholder="EG00 0000 0000 0000 0000 0000 0000"></div>
                </div>
              </div>
            </div>

          </div>

          <div class="col-lg-4">
            <div class="card mb-3">
              <div class="card-head"><h2 class="card-title">Photo</h2></div>
              <div class="card-body text-center">
                <div class="mx-auto mb-3" style="width:120px;height:120px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;color:var(--ink-4);font-size:36px;">
                  <i class="fa-solid fa-user"></i>
                </div>
                <button type="button" class="btn btn-light-2 btn-sm"><i class="fa-solid fa-upload me-1"></i> Upload photo</button>
                <div class="muted small mt-2">JPG or PNG, max 2MB</div>
              </div>
            </div>

            <div class="card mb-3">
              <div class="card-head"><h2 class="card-title">Documents</h2></div>
              <div class="card-body">
                <div class="d-grid gap-2">
                  <button type="button" class="btn btn-light-2 text-start"><i class="fa-solid fa-paperclip me-2"></i> Contract</button>
                  <button type="button" class="btn btn-light-2 text-start"><i class="fa-solid fa-paperclip me-2"></i> National ID</button>
                  <button type="button" class="btn btn-light-2 text-start"><i class="fa-solid fa-paperclip me-2"></i> CV / Resume</button>
                  <button type="button" class="btn btn-light-2 text-start"><i class="fa-solid fa-paperclip me-2"></i> Other</button>
                </div>
              </div>
            </div>

            <div class="card">
              <div class="card-body">
                <button type="submit" class="btn btn-primary w-100 mb-2"><i class="fa-solid fa-check me-1"></i> Save employee</button>
                <a href="employees.html" class="btn btn-light-2 w-100">Cancel</a>
              </div>
            </div>
          </div>
        </div>
      </form>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/permissions.js"></script>
<script src="assets/js/shell.js"></script>
<script>
// Edit mode: prefill from data if ?id=
const params = new URLSearchParams(location.search);
const id = parseInt(params.get('id'), 10);
if (id) {
  const e = LIBERTY.employees.find(x => x.id === id);
  if (e) {
    document.title = 'Edit ' + e.name + ' · HLS';
    document.body.setAttribute('data-title', 'Edit employee');
    document.addEventListener('DOMContentLoaded', () => {
      const [first, ...rest] = e.name.split(' ');
      document.getElementById('f-first').value = first;
      document.getElementById('f-last').value = rest.join(' ');
      document.getElementById('f-email').value = e.email;
      document.getElementById('f-phone').value = e.phone;
    });
  }
}
</script>
</body>
</html>
